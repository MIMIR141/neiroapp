{% extends 'base.html' %}
{% block content %}
<div class="card mt-4">
  <div class="card-body">
    <h3 class="card-title text-danger"><i class="bi bi-trash"></i> Удалить мероприятие</h3>
    <p>Вы уверены, что хотите удалить мероприятие <b>{{ event.title }}</b>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Удалить</button>
      <a href="{% url 'event_detail' event.id %}" class="btn btn-secondary">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
